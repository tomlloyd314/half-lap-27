*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--page); color: var(--ink); font: 400 15px/1.55 var(--f-body); -webkit-font-smoothing: antialiased; }

.page {
  min-height: 100vh;

}

/* Header: title bubble, route box, stats */
.hero { display: grid; gap: 14px; }
.title-bubble { background: var(--sign); color: var(--sign-ink); border-radius: 20px; padding: 6px; box-shadow: var(--shadow); }

.tagline { margin: 0; font: 600 13px/1.3 var(--f-display); text-transform: uppercase; letter-spacing: .14em; opacity: .75; }
.route-box { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 6px; }
.route-box .rp { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 11px 3px; font: 700 12px/1.2 var(--f-display); text-transform: uppercase; letter-spacing: .06em; color: var(--ink); cursor: pointer; position: relative; overflow: hidden; transition: background .2s var(--ease), border-color .2s var(--ease), transform .15s var(--ease); }
.route-box .rp.done { background: var(--sign); border-color: transparent; color: var(--sign-ink); }

@media (max-width: 640px) { .route-box { padding: 12px; gap: 6px; } .route-box .rp { font-size: 11px; padding: 4px 9px 3px; } .route-box .sep { display: none; } }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 12px; text-align: center; display: grid; gap: 2px; }

.stat span { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.banner { background: var(--warn); color: var(--warn-ink); border-radius: 12px; padding: 12px 16px; font-size: 13.5px; line-height: 1.45; }
.banner b { font-weight: 800; }

/* Tabs: each in its own palette colour */
.tabs { display: flex; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 6px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 600; box-shadow: var(--shadow); overflow-x: auto; scrollbar-width: none; }

button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 2.5px solid var(--route); outline-offset: 2px; }

h2 { margin: 0; font: 800 15px/1.2 var(--f-display); text-transform: uppercase; letter-spacing: .08em; }
.section { display: grid; gap: 16px; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* Map container: moved between tabs */
.mapwrap { position: relative; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); height: 100%; background: var(--sea); box-shadow: var(--shadow); }
#map { position: absolute; inset: 0; background: var(--sea); }

.layers { position: absolute; z-index: 500; top: 12px; left: max(12px, env(safe-area-inset-left, 0px)); display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px; box-shadow: var(--shadow); }

.layers button[aria-pressed="true"] { background: var(--sign); color: var(--sign-ink); }
.mapbtns { position: absolute; z-index: 500; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 24px; display: flex; gap: 8px; }
.mapbtn { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 9px 13px; font-weight: 700; font-size: 12.5px; cursor: pointer; box-shadow: var(--shadow); position: relative; overflow: hidden; transition: transform .15s var(--ease), box-shadow .2s var(--ease); }
.mapbtn.strong { background: var(--sign); color: var(--sign-ink); border-color: transparent; }

/* Shared card look + hover lift */
.card-look, .tile, .ov-card, .stop, .entry, .tablewrap, form.card, .pinbox, .recent { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); }
.lift { transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s var(--ease); }

/* Overview */

.linkbtn { justify-self: start; border: 0; background: none; padding: 4px 0 0; color: var(--route); font-weight: 800; font-size: 13.5px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; transition: gap .2s var(--ease); }

/* Summary tiles */

.gap { border: 1.5px dashed var(--line); border-radius: var(--r); padding: 16px 18px; color: var(--muted); font-size: 14px; }
.mini { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 13px; font-size: 12.5px; font-weight: 800; cursor: pointer; position: relative; overflow: hidden; transition: border-color .2s var(--ease), color .2s var(--ease), transform .15s var(--ease); }

.entry { overflow: hidden; }
.entry img { display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; background: var(--line); }
.entry .body { padding: 18px 20px 20px; display: grid; gap: 8px; }
.entry h3 { margin: 0; font: 600 21px/1.25 var(--f-journal); text-wrap: balance; }
.entry .when { font: 800 11.5px/1 var(--f-display); text-transform: uppercase; letter-spacing: .1em; color: var(--brown); }
.entry p { margin: 0; font: 400 16px/1.65 var(--f-journal); white-space: pre-line; }
.btnrow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.empty { text-align: center; color: var(--muted); padding: 32px 16px; border: 1.5px dashed var(--line); border-radius: var(--r); font-size: 14px; }

/* Money */

.bar .top { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }

.bar .fill { height: 100%; background: var(--route); border-radius: 5px; transform-origin: left; }
.bar .fill.over { background: var(--danger); }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }

td.r, th.r { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }

/* Log: action picker */
.actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
.action { --ac: var(--sign); display: grid; gap: 10px; justify-items: start; text-align: left; padding: 16px 16px 18px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--card); cursor: pointer; position: relative; overflow: hidden; transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s var(--ease), background .2s var(--ease); }
.action .ic { width: 38px; height: 38px; border-radius: 11px; background: var(--ac); color: var(--sign-ink); display: grid; place-items: center; transition: transform .25s var(--ease); }
.action .ic svg { width: 20px; height: 20px; }
.action b { font: 800 15px/1.1 var(--f-display); }
.action small { color: var(--muted); font-size: 12.5px; line-height: 1.35; margin-top: -4px; }
.action[aria-pressed="true"] { border-color: var(--ac); background: color-mix(in srgb, var(--ac) 22%, var(--card)); box-shadow: var(--shadow); }
.action[aria-pressed="true"] .ic { transform: scale(1.08); }

/* Forms */

.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--route); box-shadow: 0 0 0 4px color-mix(in srgb, var(--route) 18%, transparent); }
.field textarea { min-height: 140px; resize: vertical; font-family: var(--f-journal); line-height: 1.6; }

.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }

.hint { font-size: 13px; color: var(--muted); margin: 0; line-height: 1.5; }
.divider { display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chipbtn { position: relative; }
.chipbtn input { position: absolute; opacity: 0; pointer-events: none; }
.chipbtn span { display: inline-block; padding: 9px 15px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--panel); font-weight: 700; font-size: 14px; cursor: pointer; position: relative; overflow: hidden; transition: background .2s var(--ease), border-color .2s var(--ease), color .2s var(--ease), transform .15s var(--ease); }
.chipbtn input:checked + span { background: var(--route); border-color: var(--route); color: #fffdf9; }
.chipbtn input:focus-visible + span { outline: 2.5px solid var(--route); outline-offset: 2px; }
.switch { display: flex; align-items: center; gap: 14px; cursor: pointer; font-size: 15px; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .track { width: 46px; height: 28px; border-radius: 999px; background: var(--line); position: relative; flex: none; transition: background .25s var(--ease); }
.switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fffdf9; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .25s var(--ease); }
.switch input:checked + .track { background: var(--route); }

.switch input:focus-visible + .track { outline: 2.5px solid var(--route); outline-offset: 2px; }
.switches { display: grid; gap: 14px; }
.btn { border: 1px solid color-mix(in srgb, var(--sign-ink) 14%, transparent); border-radius: 12px; padding: 14px 18px; font: 800 14px/1 var(--f-display); text-transform: uppercase; letter-spacing: .07em; cursor: pointer; background: var(--sign); color: var(--sign-ink); position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 10px; transition: transform .15s var(--ease), box-shadow .2s var(--ease), background .2s var(--ease), filter .2s var(--ease); }
.btn.primary { background: var(--route); color: #fffdf9; border-color: transparent; }
.btn.ghost { background: var(--panel); color: var(--ink); border: 1.5px solid var(--line); }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn.big { padding: 18px; font-size: 15px; width: 100%; border-radius: 14px; }
.btn.done { background: var(--ok); color: #fffdf9; }
.btn[disabled] { opacity: .6; cursor: progress; }
.arrive { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: center; text-align: left; width: 100%; padding: 18px 20px; border-radius: 16px; border: 1.5px solid color-mix(in srgb, var(--warn) 70%, var(--line)); background: color-mix(in srgb, var(--warn) 22%, var(--panel)); cursor: pointer; position: relative; overflow: hidden; transition: transform .2s var(--ease), box-shadow .2s var(--ease); }
.arrive .pinic { width: 44px; height: 44px; border-radius: 50%; background: var(--warn); color: var(--warn-ink); display: grid; place-items: center; }
.arrive .pinic svg { width: 22px; height: 22px; }
.arrive b { display: block; font: 800 17px/1.25 var(--f-display); }
.arrive small { color: var(--muted); font-size: 13px; }
.arrive .go { font-size: 22px; color: var(--warn-ink); transition: transform .2s var(--ease); }
.locwrap { display: grid; gap: 14px; }
.locopts { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 14px; align-items: end; }
.locor { color: var(--muted); font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; padding-bottom: 16px; }
@media (max-width: 760px) { .locopts { grid-template-columns: minmax(0, 1fr); } .locor { padding: 0; text-align: center; } }
.locbox { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; justify-content: space-between; padding: 14px 16px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--panel); }
.locbox .loctext { display: flex; align-items: center; gap: 12px; min-width: 0; font-size: 14px; }
.locbox .locdot { width: 12px; height: 12px; border-radius: 50%; background: var(--line); flex: none; }
.locbox.ok .locdot { background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 22%, transparent); }
.locbox.finding .locdot { background: var(--warn); animation: pulse 1s ease-in-out infinite; }
.locbox.error .locdot { background: var(--danger); }

@keyframes pulse { 50% { transform: scale(1.5); opacity: .5; } }
.photozone { display: grid; place-items: center; gap: 8px; text-align: center; padding: 28px 16px; border: 2px dashed var(--line); border-radius: 14px; background: var(--panel); cursor: pointer; color: var(--muted); transition: border-color .2s var(--ease), background .2s var(--ease); position: relative; }
.photozone svg { width: 30px; height: 30px; color: var(--route); }

.photozone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.photoprev { position: relative; border-radius: 14px; overflow: hidden; }
.photoprev img { display: block; width: 100%; max-height: 320px; object-fit: cover; }

.totalbox { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 14px 18px; border-radius: 12px; background: color-mix(in srgb, var(--route) 10%, var(--panel)); border: 1px solid var(--line); }

details.more[open] > div { margin-top: 18px; display: grid; gap: 18px; }
.queue { display: flex; justify-content: space-between; gap: 14px; align-items: center; background: var(--warn); color: var(--warn-ink); padding: 12px 16px; border-radius: 12px; font-size: 14px; font-weight: 700; }
.queue button { background: var(--warn-ink); color: var(--warn); border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 800; cursor: pointer; }
.recent { padding: 6px 0; }
.recent-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--line); }
.recent-row:last-child { border-bottom: 0; }
.recent-row .ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--ac); color: var(--sign-ink); }
.recent-row .ic svg { width: 16px; height: 16px; }
.recent-row b { display: block; font-weight: 700; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recent-row small { color: var(--muted); font-size: 12.5px; }
.recent-row time { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.pinbox { padding: 28px; display: grid; gap: 18px; max-width: 460px; margin: 0 auto; width: 100%; box-shadow: var(--shadow); }
.foot { display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; padding-top: 6px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.foot button { border: 0; background: none; color: var(--muted); font-weight: 700; font-size: 13px; cursor: pointer; padding: 10px 6px 4px; text-decoration: underline; text-underline-offset: 3px; }

/* Map overlays */
.legend { position: absolute; z-index: 500; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 24px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 12px; display: grid; gap: 6px; box-shadow: var(--shadow); }
.legend div { display: flex; align-items: center; gap: 8px; }
.legend i { display: inline-block; flex: none; }
.lg-plan { width: 22px; border-top: 3px dashed var(--route); }
.lg-drive { width: 22px; height: 5px; background: var(--drive); border: 1px solid var(--casing); border-radius: 3px; }
.lg-dot { width: 11px; height: 11px; border-radius: 50%; border: 2.5px solid var(--route); background: var(--route); }
.lg-jr { width: 13px; height: 13px; border-radius: 3px; background: var(--brown); }
.pickhint { position: absolute; z-index: 600; top: calc(64px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 14px; box-shadow: 0 3px 10px rgba(0,0,0,.25); white-space: nowrap; }
.leaflet-container { font: 13px/1.4 var(--f-body); background: var(--sea); }
.leaflet-tooltip, .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--ink); border-color: var(--line); }
.leaflet-tooltip { border-radius: 10px; box-shadow: 0 3px 12px rgba(0,0,0,.18); padding: 8px 10px; }
.leaflet-popup-content-wrapper { border-radius: 14px; }
.leaflet-popup-content { margin: 14px 16px; min-width: 200px; max-width: 280px; }
.leaflet-popup-content h4 { margin: 0 0 4px; font: 700 15px/1.25 var(--f-display); }
.leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
.leaflet-bar { border-radius: 10px !important; overflow: hidden; }
.leaflet-bar a, .leaflet-control-attribution { background: var(--panel) !important; color: var(--ink) !important; }
.leaflet-control-attribution a { color: var(--route) !important; }
.jtip { width: 190px; white-space: normal; padding: 0 !important; overflow: hidden; }
.jtip img { display: block; width: 100%; height: 110px; object-fit: cover; }
.jtip div { padding: 7px 10px 9px; }
.jtip b { font: 600 14px/1.25 var(--f-journal); display: block; }
.jpop img { width: 100%; border-radius: 8px; margin: 6px 0 8px; }
.jpop p { margin: 4px 0 0; font: 14px/1.55 var(--f-journal); white-space: pre-line; max-height: 200px; overflow: auto; }
.jicon { width: 22px; height: 22px; border-radius: 5px; background: var(--brown); border: 2px solid var(--panel); display: grid; place-items: center; box-shadow: 0 1px 4px rgba(0,0,0,.35); transition: transform .2s var(--ease); }
.jicon svg { width: 12px; height: 12px; }
.here { width: 18px; height: 18px; border-radius: 50%; background: var(--warn); border: 3px solid var(--casing); position: relative; }
.here::after { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 2px solid var(--warn); animation: ping 2s ease-out infinite; }
@keyframes ping { from { transform: scale(.5); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }
.toast { position: fixed; z-index: 4000; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 13px 20px; border-radius: 14px; font-weight: 700; font-size: 14px; max-width: calc(100% - 32px); box-shadow: 0 10px 30px rgba(0,0,0,.28); display: flex; gap: 10px; align-items: center; }
.skel { border-radius: var(--r); background: linear-gradient(90deg, var(--card) 25%, color-mix(in srgb, var(--line) 70%, var(--card)) 50%, var(--card) 75%); background-size: 200% 100%; animation: shimmer 1.3s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* Motion (only when the viewer hasn't asked for less) */
.ripple { position: absolute; border-radius: 50%; background: currentColor; opacity: .18; transform: scale(0); pointer-events: none; }
@media (prefers-reduced-motion: no-preference) {
  .ripple { animation: ripple .55s var(--ease) forwards; }
  @keyframes ripple { to { transform: scale(1); opacity: 0; } }
  .btn:active, .mini:active, .action:active, .chipbtn span:active, .tabs button:active, .mapbtn:active, .arrive:active, .rp:active { transform: scale(.97); }
  .stack.enter > * { animation: rise .5s var(--ease) both; animation-delay: calc(var(--i, 0) * 60ms); }
  .itin.enter > * { animation: rise .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 30ms); }
  .formin { animation: rise .35s var(--ease) both; }

  .toast:not([hidden]) { animation: toastin .35s var(--ease) both; }
  @keyframes toastin { from { opacity: 0; transform: translate(-50%, 16px); } to { opacity: 1; transform: translate(-50%, 0); } }
  .mapwrap.expanded { animation: grow .3s var(--ease) both; }
  @keyframes grow { from { opacity: .4; transform: scale(.97); } to { opacity: 1; transform: none; } }
  .bar .fill { animation: fill .8s var(--ease) both; }
  @keyframes fill { from { transform: scaleX(0); } }
  .title-bubble { animation: rise .6s var(--ease) both; }
  .route-box { animation: rise .6s .08s var(--ease) both; }
  .stats { animation: rise .6s .16s var(--ease) both; }
  .btn.done svg { animation: pop .4s var(--ease) both; }
  @keyframes pop { from { transform: scale(0); } 60% { transform: scale(1.3); } to { transform: scale(1); } }
}


/* Share & reply */
.entry-actions { padding-top: 6px; }
.mini.share { display: inline-flex; align-items: center; gap: 7px; }
.mini.share svg { width: 15px; height: 15px; }
.mini.share[data-act="reply"] { background: var(--sign); border-color: transparent; color: var(--sign-ink); }
.entry.flash { box-shadow: 0 0 0 3px var(--warn), var(--shadow-lift); }
.chatbar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 16px 18px; border-radius: 16px; background: color-mix(in srgb, var(--c-journal) 35%, var(--card)); border: 1px solid var(--line); color: var(--ink); text-decoration: none; }
.chatbar .ic { width: 42px; height: 42px; border-radius: 12px; background: var(--c-journal); color: var(--sign-ink); display: grid; place-items: center; }
.chatbar .ic svg { width: 22px; height: 22px; }
.chatbar b { display: block; font: 800 16px/1.2 var(--f-display); }
.chatbar small { color: var(--muted); font-size: 13px; }
.chatbar .go { font-size: 20px; }
.sheet-wrap { position: fixed; inset: 0; z-index: 4500; background: rgba(20, 26, 25, 0); display: flex; align-items: flex-end; justify-content: center; transition: background .25s var(--ease); }
.sheet-wrap.open { background: rgba(20, 26, 25, .45); }
.sheet { width: min(520px, 100%); background: var(--panel); border-radius: 24px 24px 0 0; padding: 24px max(20px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; transform: translateY(100%); transition: transform .3s var(--ease); box-shadow: 0 -12px 40px rgba(0,0,0,.25); }
.sheet-wrap.open .sheet { transform: none; }
.sheet h3 { margin: 0; font: 800 19px/1.2 var(--f-display); }
.sheet .hint { margin-top: -6px; }
.sheet-opts { display: grid; gap: 10px; }
.sheet-opt { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); text-decoration: none; font-weight: 700; font-size: 15px; cursor: pointer; text-align: left; width: 100%; position: relative; overflow: hidden; }
.sheet-opt svg { width: 20px; height: 20px; color: var(--route); flex: none; }
@media (min-width: 641px) { .sheet-wrap { align-items: center; } .sheet { border-radius: 24px; } }

/* Phone polish */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--page); z-index: 5000; }
.page { padding-top: calc(32px + env(safe-area-inset-top, 0px)); }
.tabs .ti { display: none; }
.tabs .ti svg { width: 19px; height: 19px; }
.field input[type="date"], .field input[type="datetime-local"] { -webkit-appearance: none; appearance: none; display: block; min-height: 52px; text-align: left; }
.field input::-webkit-date-and-time-value { text-align: left; }
.locopts .btnrow { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: stretch; }
.locopts .btn { font-size: 13px; letter-spacing: .05em; padding-inline: 12px; }

@media (max-width: 640px) {
  .page { padding-top: calc(14px + env(safe-area-inset-top, 0px)); padding-bottom: calc(120px + env(safe-area-inset-bottom, 0px)); }

  .tabs button { flex-direction: column; gap: 5px; padding: 4px 2px; font-size: 10px; letter-spacing: .04em; background: none !important; color: var(--muted); }
  .tabs button::before { display: none; }

  .action { grid-template-rows: auto; padding: 14px 16px; }

  .action small { display: none; }
  .action:last-child { grid-column: 1 / -1; }
  form.card { padding: 18px; gap: 20px; }
  .locopts .btnrow { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .arrive { grid-template-columns: auto minmax(0, 1fr); padding: 16px; }
  .arrive .go { display: none; }
  .two { grid-template-columns: minmax(0, 1fr); }
}

@media (hover: hover) {

  .jicon:hover { transform: scale(1.2); }
}

function settings() {

    price: +s.fuelPrice || 2.1, remotePrice: +s.remoteFuelPrice || +s.fuelPrice || 2.7,
    useLogged: String(s.useLoggedEconomy).toUpperCase() !== 'FALSE',
    start: s.startDate || '', end: s.endDate || '', name: s.tripName || "Lloyd's Half Lap 27",

}
/** Real L/100km from the fuel log: litres between first and last full-tank fill ÷ km between them. */
function loggedEconomy() {
  const f = (state.data.fuel || []).filter(x => x.odo && x.litres).sort((a, b) => a.odo - b.odo);
  const fulls = f.map((x, i) => x.full ? i : -1).filter(i => i > -1);
  if (fulls.length < 2) return null;
  const a = fulls[0], b = fulls[fulls.length - 1];
  const km = f[b].odo - f[a].odo;

}
function economyUsed() {
  const s = settings(), real = loggedEconomy();

function activeStops() { return state.data.stops.filter(s => s.status !== 'skipped' && s.lat != null && s.lng != null); }

function legs() {
  const st = activeStops(), eco = economyUsed().value, s = settings(), out = [];
  for (let i = 1; i < st.length; i++) {
    const a = st[i - 1], b = st[i], cached = state.data.legs[legKey(a, b)];
    const ferry = b.travel === 'ferry';
    const straight = haversine(a, b);
    let km, hours, approx = false, poly = null;
    if (ferry) { km = 0; hours = 0; }
    else if (cached && cached.km != null) { km = cached.km; hours = cached.hours; poly = cached.poly ? decodePoly(cached.poly) : null; }
    else { km = straight < 0.5 ? 0 : straight * 1.15; hours = km / 85; approx = true; }
    const litres = km * eco / 100;
    const price = b.remote ? s.remotePrice : s.price;
    out.push({ from: a, to: b, km, hours, litres, cost: litres * price, ferry, approx, poly, price, remote: b.remote });
  }

  const mw = $('#mapwrap'), slot = $('#mapSlot'), mode = slot ? slot.dataset.mode : '';
  const ex = mw.classList.contains('expanded');
  $('#enlargeBtn').textContent = mode === 'overview' ? 'Enlarge map' : mode === 'log' ? 'Cancel' : (ex ? 'Close full screen' : 'Full screen');
}
function toggleExpand(on) {
  const mw = $('#mapwrap');
  const want = on === undefined ? !mw.classList.contains('expanded') : on;
  mw.classList.toggle('expanded', want);
  document.body.style.overflow = want ? 'hidden' : '';
  enlargeLabel();
  setTimeout(() => { if (map) { map.invalidateSize(); maybeFit(); } }, 60);
}
function fitAll(animate) {
  if (!map) return;
  const pts = state.data.stops.filter(s => s.lat != null).map(s => [s.lat, s.lng]);
  state.data.checkins.forEach(c => pts.push([c.lat, c.lng]));
  if (pts.length) map.fitBounds(pts, { padding: [30, 30], animate: !!animate });
}
function renderMap() {
  if (!map) return;
  layers.clearLayers();
  const sign = css('--route'), warn = css('--warn'), muted = css('--muted'), panel = css('--panel'), drive = css('--drive'), casing = css('--casing');

  // Planned route: road shape where the Sheet has it, straight dashes otherwise
  legs().forEach(l => {
    const pts = l.poly || [[l.from.lat, l.from.lng], [l.to.lat, l.to.lng]];
    L.polyline(pts, { color: l.ferry ? css('--ferry') : sign, weight: l.ferry ? 2.5 : 3.5, opacity: .85, dashArray: l.ferry ? '2 7' : '7 7', interactive: false }).addTo(layers);
  });

  // Driven route from check-ins
  const c = state.data.checkins;
  if (c.length > 1) {
    const pts = [];
    for (let i = 1; i < c.length; i++) {
      let seg = c[i].poly ? decodePoly(c[i].poly) : null;
      // Road shape only if it was worked out from this check-in's neighbour (backdated entries can change the order)
      if (seg && !(seg.length && haversine({ lat: seg[0][0], lng: seg[0][1] }, c[i - 1]) < 3)) seg = null;
      if (!seg) seg = [[c[i - 1].lat, c[i - 1].lng], [c[i].lat, c[i].lng]];
      pts.push(...seg);
    }
    L.polyline(pts, { color: casing, weight: 8, opacity: .45, interactive: false }).addTo(layers);
    L.polyline(pts, { color: drive, weight: 4.5, opacity: 1, interactive: false }).addTo(layers);
  }

  // Stops
  const seen = {};
  state.data.stops.forEach(s => {
    if (s.lat == null) return;
    const k = s.lat.toFixed(3) + ',' + s.lng.toFixed(3);
    const dup = seen[k]; seen[k] = true;
    const visited = s.status === 'visited', skipped = s.status === 'skipped', detour = s.type === 'detour';
    const m = L.circleMarker([s.lat, s.lng], {
      radius: dup ? 5 : 7, weight: 2.5,
      color: skipped ? muted : detour ? css('--brown') : sign,
      fillColor: visited ? (detour ? css('--brown') : sign) : panel, fillOpacity: 1,
      dashArray: skipped ? '3 3' : null
    }).addTo(layers);
    const nights = s.nights ? s.nights + (s.nights === 1 ? ' night' : ' nights') : '';
    m.bindTooltip('<b>' + esc(s.name) + '</b><br>' + [fmtDay(s.arrive), nights].filter(Boolean).join(' · ') + (s.campsite ? '<br><span class="muted">' + esc(s.campsite) + '</span>' : ''), { direction: 'top', offset: [0, -6] });
    m.bindPopup('<h4>' + esc(s.name) + '</h4><div class="muted small">' + [fmtDay(s.arrive), nights, visited ? 'Visited' : skipped ? 'Skipped' : 'Planned'].filter(Boolean).join(' · ') + '</div>' +
      (s.campsite ? '<div class="small" style="margin-top:6px"><b>Camp:</b> ' + esc(s.campsite) + '</div>' : '') +
      (s.plan ? '<div class="small" style="margin-top:4px">' + esc(s.plan) + '</div>' : ''));
    s._marker = m;
  });

  // Journal pins
  state.data.journal.forEach(j => {
    if (j.lat == null || j.lat === '') return;
    const icon = L.divIcon({ className: '', html: '<div class="jicon">' + ICON_NOTE + '</div>', iconSize: [22, 22], iconAnchor: [11, 11] });
    const m = L.marker([j.lat, j.lng], { icon, zIndexOffset: 500 }).addTo(layers);
    m.bindTooltip('<div class="jtip">' + (j.photo ? '<img src="' + esc(j.photo) + '" alt="">' : '') + '<div><b>' + esc(j.title) + '</b><span class="muted small">' + esc(fmtTime(j.time)) + '</span></div></div>', { direction: 'top', offset: [0, -12], className: 'jtip' });
    m.bindPopup('<div class="jpop"><h4>' + esc(j.title) + '</h4><div class="muted small">' + esc(fmtTime(j.time)) + (j.place ? ' · ' + esc(j.place) : '') + '</div>' +
      (j.photo ? '<img src="' + esc(j.photo) + '" alt="' + esc(j.title) + '">' : '') + '<p>' + esc(j.text) + '</p></div>', { maxWidth: 300 });
    j._marker = m;
  });

  // Where we are now
  const last = lastCheckin();
  if (last) {
    const icon = L.divIcon({ className: '', html: '<div class="here"></div>', iconSize: [18, 18], iconAnchor: [9, 9] });
    L.marker([last.lat, last.lng], { icon, zIndexOffset: 1000 }).addTo(layers)
      .bindTooltip('<b>We\'re here</b><br>' + esc(last.place || '') + '<br><span class="muted">' + esc(ago(last.time, now())) + '</span>', { direction: 'top', offset: [0, -10] });
  }

  // Picked spot for a form
  if (state.pick) {
    L.circleMarker([state.pick.lat, state.pick.lng], { radius: 9, color: casing, weight: 2, fillColor: warn, fillOpacity: .9 }).addTo(layers);
  }
}
function focusOnMap(item) {
  if (!item || item.lat == null) return;
  if (state.tab !== 'map') goTab('map');
  $('#mapwrap').scrollIntoView({ behavior: 'smooth', block: 'center' });
  map.flyTo([item.lat, item.lng], Math.max(map.getZoom(), 9), { duration: .8 });
  if (item._marker) setTimeout(() => item._marker.openPopup(), 850);
}

function render() {

const TRIP_TITLE = 'Lloyd’s Half Lap 27’';
const HEADLINE_DEFAULT = 'Wollongong, Mildura, Adelaide, Port Lincoln, Nullarbor, Esperance, Albany, Perth, Rottnest, Kalbarri, Shark Bay, Coral Bay, Exmouth, Karijini';
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
/** Key stops for the route box: the routeHeadline row in Settings, or the default list. */
function headlineStops() {
  const s = state.data.settings || {};
  return String(s.routeHeadline || HEADLINE_DEFAULT).split(',').map(x => x.trim()).filter(Boolean).map(n => {
    const want = n.toLowerCase();
    const matches = state.data.stops.filter(x => x.name.toLowerCase().includes(want));
    return { name: n, stop: matches.find(x => x.status !== 'visited') || matches[0], matches };
  });
}
function renderHeader() {
  const s = settings(), t = now(), start = parseDay(s.start), end = parseDay(s.end);
  $('#tripName').textContent = TRIP_TITLE;
  document.title = TRIP_TITLE;
  $('#tagline').textContent = start && end ? start.getDate() + ' ' + MONTHS[start.getMonth()] + ' – ' + end.getDate() + ' ' + MONTHS[end.getMonth()] + ' ' + end.getFullYear() : '';
  // Route box: key stops as chips; visited ones fill in, the one we're at glows gold
  const last = lastCheckin();
  $('#routeLine').innerHTML = headlineStops().map((h, i) => {
    const done = h.matches.length && h.matches.every(m => m.status === 'visited');
    const here = last && h.matches.some(m => m.lat != null && haversine(m, last) < 25);
    return (i ? '<span class="sep" aria-hidden="true">→</span>' : '') +
      '<button type="button" class="rp' + (here ? ' now' : done ? ' done' : '') + '"' + (h.stop ? ' data-act="focus" data-id="' + esc(h.stop.id) + '"' : '') + '>' + esc(h.name) + '</button>';
  }).join('');
  const visited = state.data.stops.filter(x => x.status === 'visited').length;
  let dayLabel, dayVal;
  if (start && t < start) { dayVal = Math.ceil((start - t) / 86400000); dayLabel = 'days to go'; }
  else if (start && end && t > addDays(end, 1)) { dayVal = Math.round((end - start) / 86400000) + 1; dayLabel = 'days on the road'; }
  else if (start) { dayVal = Math.floor((t - start) / 86400000) + 1; dayLabel = 'trip day'; }
  else { dayVal = 0; dayLabel = 'days'; }
  $('#stats').innerHTML =
    '<div class="stat"><b data-n="' + dayVal + '">' + n0(dayVal) + '</b><span>' + dayLabel + '</span></div>' +
    '<div class="stat"><b data-n="' + Math.round(drivenKm()) + '">' + n0(drivenKm()) + '</b><span>km driven</span></div>' +
    '<div class="stat"><b data-n="' + visited + '" data-suf="/' + state.data.stops.length + '">' + visited + '/' + state.data.stops.length + '</b><span>stops done</span></div>';
  if (!state.countedUp) { state.countedUp = true; countUp(); }
  const b = $('#demoBanner');
  if (DEMO) { b.hidden = false; b.innerHTML = '<b>Preview with sample entries.</b> Your real itinerary is loaded; the check-ins, journal posts and spending from 10–14 April are made up to show how it looks. Use “Crew sign-in” at the bottom (any PIN works here) to see Money and Log.'; }
  else b.hidden = true;
  document.querySelectorAll('#tabs button').forEach(btn => {
    const tab = btn.dataset.tab;
    btn.hidden = (tab === 'money' || tab === 'log') && !state.unlocked;
    btn.setAttribute('aria-selected', String(state.tab === tab));
  });
  const names = s.travellers.filter(n => !/partner/i.test(n));
  $('#foot').innerHTML = state.unlocked
    ? '<span>Signed in on this phone</span><button type="button" data-act="lock">Sign out</button>'
    : '<button type="button" data-act="crew">' + (names.length >= 2 ? esc(names.join(' & ')) + ' sign-in' : 'Crew sign-in') + '</button>';
}
function countUp() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('#stats b[data-n]').forEach(el => {
    const to = +el.dataset.n, suf = el.dataset.suf || '', t0 = performance.now();
    if (!to) return;
    const step = t => {
      const k = Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - k, 3);
      el.textContent = n0(to * e) + suf;
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

}

        (l.ferry ? '<div class="legmeta"><span>Car stays on the mainland</span></div>' :

  }

  return h;

  const doneLegs = legs().filter(l => l.to.status === 'visited');
  const fuelEst = doneLegs.reduce((a, l) => a + l.cost, 0);
  const real = loggedEconomy();
  const planned = budget.reduce((a, b) => a + (+b.planned || 0), 0);
  const tripDays = start && parseDay(s.end) ? Math.round((parseDay(s.end) - start) / 86400000) + 1 : 0;

function shrinkPhoto(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const max = 1600, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}
/** Asks the phone for its position; resolves with the pick, or null. */
function locate() {
  return new Promise(res => {
    if (!navigator.geolocation) { state.loc = { status: 'error', msg: 'Location isn’t available on this device.' }; updateLoc(); return res(null); }
    state.loc = { status: 'finding' }; updateLoc();
    navigator.geolocation.getCurrentPosition(pos => {
      state.pick = { lat: +pos.coords.latitude.toFixed(5), lng: +pos.coords.longitude.toFixed(5), label: 'Your location', acc: Math.round(pos.coords.accuracy) };
      state.loc = { status: 'ok' }; updateLoc(); renderMap(); res(state.pick);
    }, err => {
      state.loc = { status: 'error', msg: err.code === 1 ? 'Location is blocked for this site.' : 'Couldn’t get a GPS fix.' }; updateLoc(); res(null);
    }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 60000 });
  });
}

  } else if (action === 'fuel' && !has(d.fuel, p.id)) {

    (d.expenses = d.expenses || []).push({ id: 'X' + p.id, date: p.time.slice(0, 10), category: 'Fuel', amount: total, description: p.litres + ' L diesel', paidBy: p.paidBy, place: p.place });

  } else if (action === 'addStop' && !d.stops.some(s => s._pid === p.id)) {
    const i = d.stops.findIndex(s => s.id === p.afterId);
    const lat = p.lat != null ? p.lat : null, lng = p.lng != null ? p.lng : null;
    d.stops.splice(i + 1, 0, { id: p.id, _pid: p.id, name: p.name, arrive: p.arrive || '', nights: +p.nights || 0, campsite: p.campsite || '', plan: '', notes: lat == null ? 'Location will be found from the name when this syncs' : '', lat, lng, status: 'planned', booked: false, remote: !!p.remote, travel: 'drive', type: p.type });

}
async function save(action, payload) {
  payload.id = payload.id || uid(action[0].toUpperCase());
  payload.time = payload.time || (DEMO ? new Date(now().getTime() + 60000) : new Date()).toISOString();
  applyLocal(action, payload);
  state.pick = null; state.photo = null; state.loc = { status: 'done' };
  render();
  flashSaved();
  if (DEMO) { toast('Saved in this preview. Connect your Sheet to save for real.', true); return; }
  state.queue.push({ action, payload });
  if (!LS.set('hl27_queue', state.queue)) toast('Saved, but too big to keep offline. Keep this page open until it sends.');
  await flush(true);
}
let flushing = false;
async function flush(fromSave) {
  if (DEMO || flushing || !state.queue.length) return;
  flushing = true;
  let sent = 0, failedNet = false;
  while (state.queue.length) {
    const item = state.queue[0];
    try {
      const r = await fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify({ pin: state.pin, action: item.action, payload: item.payload }) });
      const j = await r.json();
      if (!j.ok) {
        if (j.error === 'Wrong PIN') { lockPhone(); toast('Your PIN has changed. Unlock again to send.'); break; }
        toast('Not saved: ' + j.error);
        state.queue.shift();
      } else {
        state.queue.shift(); sent++;
        state.data = sortData(j.data); state.unlocked = true;
        LS.set('hl27_cache', j.data);
      }
      LS.set('hl27_queue', state.queue);
    } catch (e) { failedNet = true; break; }
  }
  flushing = false;
  state.queue.forEach(q => applyLocal(q.action, q.payload));
  render();
  if (failedNet && fromSave) toast('No signal. Saved on this phone and will send when you\'re back in range.');
  else if (sent) toast(sent === 1 ? 'Saved to the Sheet.' : sent + ' entries saved to the Sheet.', true);
}

async function load() {
  if (DEMO) { if (!state.data) state.data = demoData(); state.unlocked = !!state.pin; render(); return; }
  if (!state.data) {
    const cached = LS.get('hl27_cache', null);
    if (cached) { state.data = sortData(cached); state.unlocked = !!(state.pin && cached.fuel); state.queue.forEach(q => applyLocal(q.action, q.payload)); render(); }
  }
  try {
    const r = await fetch(CONFIG.API_URL + '?action=data' + (state.pin ? '&pin=' + encodeURIComponent(state.pin) : ''));
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    state.data = sortData(j.data); state.unlocked = !!j.unlocked;
    if (state.pin && !j.unlocked) lockPhone();
    LS.set('hl27_cache', j.data);
    state.queue.forEach(q => applyLocal(q.action, q.payload));
    render();
    flush(false);
  } catch (e) {
    if (!state.data) { $('#panel').innerHTML = '<div class="empty">Couldn\'t reach the trip data. Check your signal and refresh.</div>'; }
    else toast('No signal. Showing the last saved copy.');
  }
}
