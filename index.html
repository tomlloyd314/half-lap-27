.plate .route { font: 600 13px/1.3 var(--f-display); text-transform: uppercase; letter-spacing: .06em; opacity: .9; }
.plate .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; border-top: 1.5px solid color-mix(in srgb, var(--sign-ink) 22%, transparent); padding-top: 10px; }
.plate .stat b { display: block; font: 600 20px/1.1 var(--f-mono); font-variant-numeric: tabular-nums; }
.plate .stat span { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; opacity: .85; }
.where { display: flex; gap: 10px; align-items: center; font-size: 14px; }
.where .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 40%, transparent); flex: none; }
.banner { background: var(--warn); color: var(--warn-ink); border-radius: 8px; padding: 9px 12px; font-size: 13.5px; line-height: 1.4; }
.banner b { font-weight: 800; }

/* Tabs */
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.tabs button { border: 0; background: none; padding: 8px 4px; border-radius: 7px; font: 700 13.5px/1 var(--f-display); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; }
.tabs button[aria-selected="true"] { background: var(--sign); color: var(--sign-ink); }
.tabs svg { width: 12px; height: 12px; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2.5px solid var(--warn); outline-offset: 2px; }

h2 { margin: 0; font: 800 15px/1.2 var(--f-display); text-transform: uppercase; letter-spacing: .07em; }
.section { display: grid; gap: 10px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* Summary tiles */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; min-width: 0; }
.tile b { display: block; font: 600 21px/1.15 var(--f-mono); font-variant-numeric: tabular-nums; }
.tile span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.tile small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.fineprint { font-size: 12.5px; color: var(--muted); }

/* Itinerary */
.week { font: 800 12px/1 var(--f-display); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); padding: 12px 0 2px; display: flex; gap: 8px; align-items: center; }
.week::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.leg { margin: 2px 0 2px 22px; display: grid; gap: 5px; }
.legsign { display: flex; align-items: center; gap: 8px; background: var(--sign); color: var(--sign-ink); border-radius: 6px; padding: 5px 10px 4px; border: 1px solid color-mix(in srgb, var(--sign-ink) 12%, transparent); font: 700 13px/1.2 var(--f-display); text-transform: uppercase; letter-spacing: .04em; width: fit-content; max-width: 100%; }
.legsign.ferry { background: var(--ferry); color: var(--sign-ink); }
.legsign .km { font: 600 13px var(--f-mono); }
.legsign svg { width: 14px; height: 14px; flex: none; }
.legmeta { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--panel); white-space: nowrap; }
.chip.warn { background: var(--warn); color: var(--warn-ink); border-color: transparent; }
.chip.ok { background: var(--sign); color: var(--sign-ink); border-color: transparent; }
.chip.peach { background: var(--peach); color: var(--warn-ink); border-color: transparent; }
.chip.detour { border-color: var(--brown); color: var(--brown); }
.stop { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 10px; align-items: start; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; cursor: pointer; text-align: left; width: 100%; }
.stop:hover { border-color: var(--route); }
.stop .pin { width: 12px; height: 12px; border-radius: 50%; border: 2.5px solid var(--route); background: var(--panel); margin-top: 4px; }
.stop.visited .pin { background: var(--route); }
.stop.skipped { opacity: .55; }
.stop.skipped .pin { border-color: var(--muted); border-style: dashed; }
.stop.detour .pin { border-color: var(--brown); }
.stop .name { font: 700 16px/1.25 var(--f-display); }
.stop .meta { font-size: 13px; color: var(--muted); }
.stop .plan { font-size: 13.5px; margin-top: 3px; }
.stop .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
.gap { border: 1.5px dashed var(--line); border-radius: var(--r); padding: 12px; color: var(--muted); font-size: 14px; }
.mini { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 3px 9px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
.mini:hover { border-color: var(--route); color: var(--route); }

/* Journal */
.entry { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.entry img { display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; background: var(--line); }
.entry .body { padding: 12px 14px 14px; display: grid; gap: 4px; }
.entry h3 { margin: 0; font: 600 19px/1.25 var(--f-journal); text-wrap: balance; }
.entry .when { font: 700 11.5px/1 var(--f-display); text-transform: uppercase; letter-spacing: .08em; color: var(--brown); }
.entry p { margin: 4px 0 0; font: 400 15.5px/1.6 var(--f-journal); white-space: pre-line; }
.entry .tag { font-size: 12px; color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 24px 12px; border: 1.5px dashed var(--line); border-radius: var(--r); font-size: 14px; }

/* Money */
.bars { display: grid; gap: 10px; }
.bar { display: grid; gap: 4px; }
.bar .top { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; }
.bar .track { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--route); border-radius: 4px; }
.bar .fill.over { background: var(--danger); }
.tablewrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font: 700 11px/1 var(--f-display); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
td.r, th.r { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }

/* Forms */
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 13.5px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
form.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label, .lbl { font-size: 12.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 9px 10px; font-size: 16px; min-width: 0; }
.field textarea { min-height: 110px; resize: vertical; font-family: var(--f-journal); }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--route); }
.btn { border: 1px solid color-mix(in srgb, var(--sign-ink) 18%, transparent); border-radius: 8px; padding: 11px 14px; font: 800 14px/1 var(--f-display); text-transform: uppercase; letter-spacing: .06em; cursor: pointer; background: var(--sign); color: var(--sign-ink); }
.btn.ghost { background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
.btn.big { padding: 15px; font-size: 16px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
.loc { font-size: 13px; color: var(--muted); }
.loc b { color: var(--ink); }
.preview-img { max-height: 180px; border-radius: 8px; object-fit: cover; }
.queue { display: flex; justify-content: space-between; gap: 10px; align-items: center; background: var(--warn); color: var(--warn-ink); padding: 8px 12px; border-radius: 8px; font-size: 13.5px; font-weight: 600; }
.queue button { background: var(--warn-ink); color: var(--warn); border: 0; border-radius: 6px; padding: 5px 10px; font-weight: 800; cursor: pointer; }

/* Map overlays */
.legend { position: absolute; z-index: 500; left: max(10px, env(safe-area-inset-left, 0px)); bottom: 22px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; display: grid; gap: 4px; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
.legend div { display: flex; align-items: center; gap: 7px; }
.legend i { display: inline-block; flex: none; }
.lg-plan { width: 22px; border-top: 3px dashed var(--route); }
.lg-drive { width: 22px; height: 5px; background: var(--drive); border: 1px solid var(--casing); border-radius: 3px; }
.lg-dot { width: 11px; height: 11px; border-radius: 50%; border: 2.5px solid var(--route); background: var(--route); }
.lg-jr { width: 13px; height: 13px; border-radius: 3px; background: var(--brown); }
.pickhint { position: absolute; z-index: 600; top: 12px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-weight: 700; font-size: 13.5px; box-shadow: 0 3px 10px rgba(0,0,0,.25); white-space: nowrap; }
.mapbtn { position: absolute; z-index: 500; right: max(10px, env(safe-area-inset-right, 0px)); bottom: 22px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-weight: 700; font-size: 12.5px; cursor: pointer; }
.leaflet-container { font: 13px/1.4 var(--f-body); background: var(--sea); }
.leaflet-tooltip, .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--ink); border-color: var(--line); }
.leaflet-tooltip { border-radius: 8px; box-shadow: 0 3px 12px rgba(0,0,0,.18); padding: 7px 9px; }
.leaflet-popup-content { margin: 12px 14px; min-width: 200px; max-width: 280px; }
.leaflet-popup-content h4 { margin: 0 0 2px; font: 700 15px/1.25 var(--f-display); }
.leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
.leaflet-bar a, .leaflet-control-attribution { background: var(--panel) !important; color: var(--ink) !important; }
.leaflet-control-attribution a { color: var(--route) !important; }
.jtip { width: 190px; white-space: normal; padding: 0 !important; overflow: hidden; }
.jtip img { display: block; width: 100%; height: 110px; object-fit: cover; }
.jtip div { padding: 6px 9px 8px; }
.jtip b { font: 600 14px/1.25 var(--f-journal); display: block; }
.jpop img { width: 100%; border-radius: 6px; margin: 4px 0 6px; }
.jpop p { margin: 4px 0 0; font: 14px/1.5 var(--f-journal); white-space: pre-line; max-height: 200px; overflow: auto; }
.jicon { width: 22px; height: 22px; border-radius: 5px; background: var(--brown); border: 2px solid var(--panel); display: grid; place-items: center; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
.jicon svg { width: 12px; height: 12px; }
.here { width: 18px; height: 18px; border-radius: 50%; background: var(--warn); border: 3px solid var(--casing); position: relative; }
.here::after { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 2px solid var(--warn); animation: ping 2s ease-out infinite; }
@keyframes ping { from { transform: scale(.5); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .here::after { animation: none; opacity: .5; } }
.toast { position: fixed; z-index: 2000; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; max-width: calc(100% - 32px); box-shadow: 0 4px 16px rgba(0,0,0,.25); }
.pinbox { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; }
</style>

</div>

function settings() {

    price: +s.fuelPrice || 2.1, remotePrice: +s.remoteFuelPrice || +s.fuelPrice || 2.7,
    useLogged: String(s.useLoggedEconomy).toUpperCase() !== 'FALSE',
    start: s.startDate || '', end: s.endDate || '', name: s.tripName || "Lloyd's Half Lap 27",

/** Real L/100km from the fuel log: litres between first and last full-tank fill ÷ km between them. */
function loggedEconomy() {
  const f = (state.data.fuel || []).filter(x => x.odo && x.litres).sort((a, b) => a.odo - b.odo);
  const fulls = f.map((x, i) => x.full ? i : -1).filter(i => i > -1);
  if (fulls.length < 2) return null;
  const a = fulls[0], b = fulls[fulls.length - 1];
  const km = f[b].odo - f[a].odo;

}

  const st = activeStops(), eco = economyUsed().value, s = settings(), out = [];

    const ferry = b.travel === 'ferry';
    const straight = haversine(a, b);

    const nights = s.nights ? s.nights + (s.nights === 1 ? ' night' : ' nights') : '';

    m.bindPopup('<h4>' + esc(s.name) + '</h4><div class="muted small">' + [fmtDay(s.arrive), nights, visited ? 'Visited' : skipped ? 'Skipped' : 'Planned'].filter(Boolean).join(' · ') + '</div>' +
      (s.campsite ? '<div class="small" style="margin-top:6px"><b>Camp:</b> ' + esc(s.campsite) + '</div>' : '') +
      (s.plan ? '<div class="small" style="margin-top:4px">' + esc(s.plan) + '</div>' : ''));
    s._marker = m;
  });

  // Journal pins
  state.data.journal.forEach(j => {
    if (j.lat == null || j.lat === '') return;
    const icon = L.divIcon({ className: '', html: '<div class="jicon">' + ICON_NOTE + '</div>', iconSize: [22, 22], iconAnchor: [11, 11] });
    const m = L.marker([j.lat, j.lng], { icon, zIndexOffset: 500 }).addTo(layers);
    m.bindTooltip('<div class="jtip">' + (j.photo ? '<img src="' + esc(j.photo) + '" alt="">' : '') + '<div><b>' + esc(j.title) + '</b><span class="muted small">' + esc(fmtTime(j.time)) + '</span></div></div>', { direction: 'top', offset: [0, -12], className: 'jtip' });
    m.bindPopup('<div class="jpop"><h4>' + esc(j.title) + '</h4><div class="muted small">' + esc(fmtTime(j.time)) + (j.place ? ' · ' + esc(j.place) : '') + '</div>' +
      (j.photo ? '<img src="' + esc(j.photo) + '" alt="' + esc(j.title) + '">' : '') + '<p>' + esc(j.text) + '</p></div>', { maxWidth: 300 });
    j._marker = m;
  });

  // Where we are now
  const last = lastCheckin();
  if (last) {
    const icon = L.divIcon({ className: '', html: '<div class="here"></div>', iconSize: [18, 18], iconAnchor: [9, 9] });
    L.marker([last.lat, last.lng], { icon, zIndexOffset: 1000 }).addTo(layers)
      .bindTooltip('<b>We\'re here</b><br>' + esc(last.place || '') + '<br><span class="muted">' + esc(ago(last.time, now())) + '</span>', { direction: 'top', offset: [0, -10] });
  }

  // Picked spot for a form
  if (state.pick) {
    L.circleMarker([state.pick.lat, state.pick.lng], { radius: 9, color: casing, weight: 2, fillColor: warn, fillOpacity: .9 }).addTo(layers);
  }
  if (!state.fitted) { fitAll(false); state.fitted = true; }
}
function focusOnMap(item) {
  if (!item || item.lat == null) return;
  if (matchMedia('(max-width: 899px)').matches) window.scrollTo({ top: 0, behavior: 'smooth' });
  map.flyTo([item.lat, item.lng], Math.max(map.getZoom(), 9), { duration: .8 });
  if (item._marker) setTimeout(() => item._marker.openPopup(), 850);
}

/* =========================================================
   PANEL RENDERING
   ========================================================= */
function render() {
  renderHeader();
  renderMap();
  renderPanel();
}
function renderHeader() {
  const s = settings(), t = now(), start = parseDay(s.start), end = parseDay(s.end);
  $('#tripName').textContent = s.name;
  document.title = s.name;
  // Main waypoints for the subtitle
  const big = state.data.stops.filter((x, i) => i === 0 || (x.nights >= 2 && x.travel !== 'ferry' && x.status !== 'skipped'));
  const names = []; big.forEach(x => { const n = x.name.replace(/\s*\(.*\)/, '').split(' & ')[0]; if (!names.includes(n)) names.push(n); });
  $('#routeLine').textContent = names.join(' → ');
  const visited = state.data.stops.filter(x => x.status === 'visited').length;
  let dayLabel, dayVal;
  if (start && t < start) { dayVal = Math.ceil((start - t) / 86400000); dayLabel = 'days to go'; }
  else if (start && end && t > addDays(end, 1)) { dayVal = Math.round((end - start) / 86400000) + 1; dayLabel = 'days on the road'; }
  else if (start) { dayVal = Math.floor((t - start) / 86400000) + 1; dayLabel = 'trip day'; }
  else { dayVal = '—'; dayLabel = 'days'; }
  $('#stats').innerHTML =
    '<div class="stat"><b>' + dayVal + '</b><span>' + dayLabel + '</span></div>' +
    '<div class="stat"><b>' + n0(drivenKm()) + '</b><span>km driven</span></div>' +
    '<div class="stat"><b>' + visited + '/' + state.data.stops.length + '</b><span>stops done</span></div>';
  const last = lastCheckin();
  $('#where').innerHTML = last
    ? '<span class="dot"></span><span>Last check-in: <b>' + esc(last.place || 'on the road') + '</b> · ' + esc(ago(last.time, t)) + (last.note ? ' — ' + esc(last.note) : '') + '</span>'
    : '<span class="dot"></span><span>No check-ins yet. The golden dot will show where we are once we hit the road.</span>';
  const b = $('#demoBanner');
  if (DEMO) { b.hidden = false; b.innerHTML = '<b>Preview with sample entries.</b> Your real itinerary is loaded; the check-ins, journal posts and spending from 10–14 April are made up to show how it looks. Any PIN unlocks Money and Log here.'; }
  else b.hidden = true;
  document.querySelectorAll('#tabs button').forEach(btn => {
    const tab = btn.dataset.tab, locked = (tab === 'money' || tab === 'log') && !state.unlocked;
    btn.setAttribute('aria-selected', String(state.tab === tab));
    btn.innerHTML = { trip: 'Trip', journal: 'Journal', money: 'Money', log: 'Log' }[tab] + (locked ? ICON_LOCK : '');
  });
}
function renderPanel() {
  const p = $('#panel');
  const tab = state.tab;
  if ((tab === 'money' || tab === 'log') && !state.unlocked) { p.innerHTML = pinHTML(); return; }
  p.innerHTML = tab === 'trip' ? tripHTML() : tab === 'journal' ? journalHTML() : tab === 'money' ? moneyHTML() : logHTML();
  if (tab === 'log') bindLog();
}

function tripHTML() {
  const s = settings(), L_ = legs(), eco = economyUsed(), range = safeRange();
  const remaining = L_.filter(l => l.to.status !== 'visited');
  const sum = (arr, k) => arr.reduce((a, x) => a + x[k], 0);
  const nights = state.data.stops.reduce((a, x) => a + (x.status !== 'skipped' ? (x.nights || 0) : 0), 0);
  let h = '<section class="section"><h2>Fuel plan</h2><div class="tiles">' +
    '<div class="tile"><span>Planned driving</span><b>' + n0(sum(L_, 'km')) + ' km</b><small>' + n0(sum(remaining, 'km')) + ' km still to go</small></div>' +
    '<div class="tile"><span>Diesel needed</span><b>' + n0(sum(L_, 'litres')) + ' L</b><small>' + n0(sum(remaining, 'litres')) + ' L still to buy</small></div>' +
    '<div class="tile"><span>Fuel cost</span><b>' + money(sum(L_, 'cost')) + '</b><small>' + money(sum(remaining, 'cost')) + ' still to spend</small></div>' +
    '<div class="tile"><span>Nights planned</span><b>' + nights + '</b><small>' + activeStops().length + ' stops</small></div>' +
    '</div><p class="fineprint">At <b>' + n1(eco.value) + ' L/100km</b> (' + (eco.source === 'logged' ? 'your real figure from the fuel log' : 'planning figure; switches to your real figure after two full-tank fills') + '), $' + s.price.toFixed(2) + '/L in town and $' + s.remotePrice.toFixed(2) + '/L remote. One ' + s.tank + ' L tank with ' + s.reserve + ' L kept in reserve' + (s.jerry ? ' plus ' + s.jerry + ' L of jerry cans' : '') + ' gets you about <b>' + n0(range) + ' km</b>. ' +
    (L_.some(l => l.approx) ? 'Distances marked ≈ are straight-line estimates until the Sheet works out the road distance.' : '') + '</p></section>';

  h += '<section class="section"><h2>Itinerary</h2><div>';
  const start = parseDay(s.start);
  let lastWeek = null, prevActive = null;
  const legByTo = new Map(L_.map(l => [l.to, l]));
  state.data.stops.forEach((st, i) => {
    const d = parseDay(st.arrive);
    if (start && d) {
      const w = Math.floor((d - start) / 86400000 / 7) + 1;
      if (w !== lastWeek) { const ws = addDays(start, (w - 1) * 7); h += '<div class="week">Week ' + w + ' · ' + ws.getDate() + ' ' + MON[ws.getMonth()] + '</div>'; lastWeek = w; }
    }
    const l = legByTo.get(st);
    if (l && (l.km > 0 || l.ferry)) {
      const fills = !l.ferry ? Math.max(0, Math.ceil(l.km / range) - 1) : 0;
      h += '<div class="leg"><div class="legsign' + (l.ferry ? ' ferry' : '') + '">' + ICON_ARROW + '<span>' + esc(st.name) + '</span><span class="km">' + (l.ferry ? 'FERRY' : (l.approx ? '≈' : '') + n0(l.km) + ' km') + '</span></div>' +
        (l.ferry ? '<div class="legmeta"><span>Car stays on the mainland</span></div>' :
        '<div class="legmeta"><span class="num">' + n1(l.hours) + ' h</span><span class="num">' + n0(l.litres) + ' L</span><span class="num">~' + money(l.cost) + '</span>' +
        (l.remote ? '<span class="chip">Remote fuel $' + l.price.toFixed(2) + '</span>' : '') +
        (fills && l.remote ? '<span class="chip warn">Longer than one tank: plan ' + fills + ' fuel stop' + (fills > 1 ? 's' : '') + ' or carry a jerry can</span>' : fills ? '<span class="chip">Refuel ' + fills + '× on the way</span>' : '') +
        '</div>') + '</div>';
    }
    const cls = ['stop', st.status, st.type === 'detour' ? 'detour' : ''].join(' ');
    const nightsTxt = st.nights ? st.nights + (st.nights === 1 ? ' night' : ' nights') : (i === 0 ? 'Departure' : 'Pass through');
    h += '<div style="padding:4px 0"><div class="' + cls + '" role="button" tabindex="0" data-act="focus" data-id="' + esc(st.id) + '"><span class="pin"></span><div style="min-width:0">' +
      '<div class="name">' + esc(st.name) + '</div>' +
      '<div class="meta">' + [fmtDay(st.arrive), nightsTxt, st.campsite].filter(Boolean).map(esc).join(' · ') + '</div>' +
      (st.plan ? '<div class="plan">' + esc(st.plan) + '</div>' : '') +
      (st.notes ? '<div class="plan muted small">' + (/^https?:/.test(st.notes) ? '<a href="' + esc(st.notes) + '" target="_blank" rel="noopener">' + esc(st.notes.replace(/^https?:\/\/(www\.)?/, '').slice(0, 40)) + '…</a>' : esc(st.notes)) + '</div>' : '') +
      '<div class="row">' +
      (st.status === 'visited' ? '<span class="chip ok">Visited</span>' : st.status === 'skipped' ? '<span class="chip">Skipped</span>' : '') +
      (st.type === 'detour' ? '<span class="chip detour">Detour</span>' : '') +
      (st.booked ? '<span class="chip peach">Booked</span>' : '') +
      (state.unlocked ? (st.status !== 'visited' ? '<button class="mini" data-act="status" data-status="visited" data-id="' + esc(st.id) + '">Arrived</button>' : '') +
        (st.status !== 'skipped' && st.status !== 'visited' ? '<button class="mini" data-act="status" data-status="skipped" data-id="' + esc(st.id) + '">Skip</button>' : '') +
        (st.status !== 'planned' ? '<button class="mini" data-act="status" data-status="planned" data-id="' + esc(st.id) + '">Undo</button>' : '') : '') +
      '</div></div></div></div>';
    if (st.status !== 'skipped') prevActive = st;
  });
  // Unplanned gap at the end
  const last = state.data.stops[state.data.stops.length - 1], end = parseDay(s.end);
  if (last && end) {
    const free = addDays(parseDay(last.arrive), last.nights || 0);
    const gap = Math.round((end - free) / 86400000);
    if (gap > 0) h += '<div style="padding:6px 0"><div class="gap"><b>' + fmtDay(dayIso(free)) + ' – ' + fmtDay(s.end) + ': ' + gap + ' nights still to plan.</b> Add stops in the Sheet or from the Log tab and they\'ll appear on the map.</div></div>';
  }
  h += '</div></section>';
  return h;
}

function moneyHTML() {
  const s = settings(), ex = state.data.expenses || [], budget = state.data.budget || [], fuel = state.data.fuel || [];
  const total = ex.reduce((a, x) => a + (+x.amount || 0), 0);
  const t = now(), start = parseDay(s.start);
  const days = start && t >= start ? Math.max(1, Math.floor((t - start) / 86400000) + 1) : 0;
  const byCat = {}; ex.forEach(x => byCat[x.category || 'Other'] = (byCat[x.category || 'Other'] || 0) + (+x.amount || 0));
  const fuelSpent = byCat['Fuel'] || 0;
  const doneLegs = legs().filter(l => l.to.status === 'visited');
  const fuelEst = doneLegs.reduce((a, l) => a + l.cost, 0);
  const real = loggedEconomy();
  const planned = budget.reduce((a, b) => a + (+b.planned || 0), 0);
  const tripDays = start && parseDay(s.end) ? Math.round((parseDay(s.end) - start) / 86400000) + 1 : 0;
  let h = '<section class="section"><h2>Spending</h2><div class="tiles">' +
    '<div class="tile"><span>Spent so far</span><b>' + money(total) + '</b><small>' + (planned ? 'of ' + money(planned) + ' budget' : 'Set a budget in the Sheet') + '</small></div>' +
    '<div class="tile"><span>Per day</span><b>' + (days ? money(total / days) : '—') + '</b><small>' + (days ? 'over ' + days + ' days' : 'Starts on day 1') + (planned && tripDays ? ' · budget ' + money(planned / tripDays) + '/day' : '') + '</small></div>' +
    '<div class="tile"><span>Fuel spent</span><b>' + money(fuelSpent) + '</b><small>Estimate for legs done: ' + money(fuelEst) + '</small></div>' +
    '<div class="tile"><span>Real economy</span><b>' + (real ? n1(real.value) : '—') + '</b><small>' + (real ? 'L/100km over ' + n0(real.km) + ' km' : 'Needs two full-tank fills') + '</small></div>' +
    '</div></section>';
  const cats = Array.from(new Set(budget.map(b => b.category).concat(Object.keys(byCat))));
  h += '<section class="section"><h2>Budget by category</h2><div class="bars">' + cats.map(c => {
    const spent = byCat[c] || 0, plan = +(budget.find(b => b.category === c) || {}).planned || 0;
    const pct = plan ? Math.min(100, spent / plan * 100) : (spent ? 100 : 0);
    return '<div class="bar"><div class="top"><span>' + esc(c) + '</span><span class="num">' + money(spent) + (plan ? ' <span class="muted">/ ' + money(plan) + '</span>' : '') + '</span></div><div class="track"><div class="fill' + (plan && spent > plan ? ' over' : '') + '" style="width:' + pct.toFixed(1) + '%"></div></div></div>';
  }).join('') + '</div></section>';
  const f = fuel.slice().sort((a, b) => (a.odo || 0) - (b.odo || 0));
  h += '<section class="section"><h2>Fuel log</h2>' + (f.length ? '<div class="tablewrap"><table><thead><tr><th>Date</th><th>Where</th><th class="r">Odo</th><th class="r">L</th><th class="r">$/L</th><th class="r">Total</th><th class="r">L/100</th></tr></thead><tbody>' +
    f.map((x, i) => {
      let eco = '';
      if (x.full && i > 0) {
        let j = i - 1, litres = x.litres; while (j >= 0 && !f[j].full) { litres += f[j].litres; j--; }
        if (j >= 0 && x.odo > f[j].odo) eco = n1(litres / (x.odo - f[j].odo) * 100);
      }
      return '<tr><td>' + esc(fmtDay((x.time || '').slice(0, 10))) + '</td><td>' + esc(x.place) + '</td><td class="r">' + (x.odo ? n0(x.odo) : '') + '</td><td class="r">' + n1(x.litres) + '</td><td class="r">' + (x.price ? x.price.toFixed(2) : '') + '</td><td class="r">' + money2(x.total || 0) + '</td><td class="r">' + eco + '</td></tr>';
    }).join('') + '</tbody></table></div>' : '<div class="empty">No fills yet. Log one from the Log tab.</div>') + '</section>';
  const recent = ex.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '')).slice(0, 25);
  h += '<section class="section"><h2>Recent expenses</h2>' + (recent.length ? '<div class="tablewrap"><table><thead><tr><th>Date</th><th>What</th><th>Category</th><th class="r">Amount</th></tr></thead><tbody>' +
    recent.map(x => '<tr><td>' + esc(fmtDay(x.date)) + '</td><td>' + esc(x.description || '') + (x.paidBy ? ' <span class="muted">(' + esc(x.paidBy) + ')</span>' : '') + '</td><td>' + esc(x.category) + '</td><td class="r">' + money2(x.amount || 0) + '</td></tr>').join('') +
    '</tbody></table></div>' : '<div class="empty">Nothing spent yet.</div>') + '<p class="fineprint">Everything here is private: family see the map, trip and journal only.</p></section>';
  return h;
}

function shrinkPhoto(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const max = 1600, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}

  }, err => {

  }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 60000 });

/* =========================================================
   SAVING: optimistic update + offline queue
   ========================================================= */
function applyLocal(action, p) {
  const d = state.data;
  const has = (arr, id) => (arr || []).some(x => x.id === id);
  if (action === 'checkin' && !has(d.checkins, p.id)) {
    d.checkins.push({ id: p.id, time: p.time, lat: p.lat, lng: p.lng, place: p.place || '', note: p.note || '', km: null, poly: '' });
    let best = null;
    d.stops.forEach(s => { if (s.status === 'planned' && s.lat != null) { const k = haversine(s, p); if (k < 20 && (!best || k < best.k)) best = { s, k }; } });
    if (best) best.s.status = 'visited';
  } else if (action === 'journal' && !has(d.journal, p.id)) {
    d.journal.push({ id: p.id, time: p.time, title: p.title, text: p.text, lat: p.lat, lng: p.lng, place: p.place || '', photo: p.photo || '', public: p.public });
  } else if (action === 'fuel' && !has(d.fuel, p.id)) {
    const total = +p.total || +(p.litres * p.price).toFixed(2);
    (d.fuel = d.fuel || []).push({ id: p.id, time: p.time, odo: +p.odo, litres: +p.litres, price: +p.price, total, place: p.place, full: p.full });
    (d.expenses = d.expenses || []).push({ id: 'X' + p.id, date: p.time.slice(0, 10), category: 'Fuel', amount: total, description: p.litres + ' L diesel', paidBy: p.paidBy, place: p.place });
  } else if (action === 'expense' && !has(d.expenses, p.id)) {
    (d.expenses = d.expenses || []).push({ id: p.id, date: p.date, category: p.category, amount: +p.amount, description: p.description, paidBy: p.paidBy, place: p.place });
  } else if (action === 'addStop' && !d.stops.some(s => s._pid === p.id)) {
    const i = d.stops.findIndex(s => s.id === p.afterId);
    const lat = p.lat != null ? p.lat : null, lng = p.lng != null ? p.lng : null;
    d.stops.splice(i + 1, 0, { id: p.id, _pid: p.id, name: p.name, arrive: p.arrive || '', nights: +p.nights || 0, campsite: p.campsite || '', plan: '', notes: lat == null ? 'Location will be found from the name when this syncs' : '', lat, lng, status: 'planned', booked: false, remote: !!p.remote, travel: 'drive', type: p.type });
  } else if (action === 'stopStatus') {
    const s = d.stops.find(x => x.id === p.id); if (s) s.status = p.status;
  }
}
async function save(action, payload) {
  payload.id = payload.id || uid(action[0].toUpperCase());
  payload.time = payload.time || new Date().toISOString();
  applyLocal(action, payload);
  state.pick = null; state.photo = null;
  render();
  if (DEMO) { toast('Saved in this preview. Connect your Sheet to save for real.'); return; }
  state.queue.push({ action, payload });
  if (!LS.set('hl27_queue', state.queue)) toast('Saved, but too big to keep offline. Keep this page open until it sends.');
  await flush(true);
}
let flushing = false;
async function flush(fromSave) {
  if (DEMO || flushing || !state.queue.length) return;
  flushing = true;
  let sent = 0, failedNet = false;
  while (state.queue.length) {
    const item = state.queue[0];
    try {
      const r = await fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify({ pin: state.pin, action: item.action, payload: item.payload }) });
      const j = await r.json();
      if (!j.ok) {
        if (j.error === 'Wrong PIN') { lockPhone(); toast('Your PIN has changed. Unlock again to send.'); break; }
        toast('Not saved: ' + j.error);
        state.queue.shift();
      } else {
        state.queue.shift(); sent++;
        state.data = j.data; state.unlocked = true;
        LS.set('hl27_cache', j.data);
      }
      LS.set('hl27_queue', state.queue);
    } catch (e) { failedNet = true; break; }
  }
  flushing = false;
  state.queue.forEach(q => applyLocal(q.action, q.payload));
  render();
  if (failedNet && fromSave) toast('No signal. Saved on this phone and will send when you\'re back in range.');
  else if (sent) toast(sent === 1 ? 'Saved to the Sheet.' : sent + ' entries saved to the Sheet.');
}
function lockPhone() { state.pin = ''; state.unlocked = false; LS.set('hl27_pin', ''); }

document.addEventListener('click', e => {

});

/* =========================================================
   LOADING
   ========================================================= */
async function load() {
  if (DEMO) { if (!state.data) state.data = demoData(); state.unlocked = !!state.pin; render(); return; }
  if (!state.data) {
    const cached = LS.get('hl27_cache', null);
    if (cached) { state.data = cached; state.unlocked = !!(state.pin && cached.fuel); state.queue.forEach(q => applyLocal(q.action, q.payload)); render(); }
  }
  try {
    const r = await fetch(CONFIG.API_URL + '?action=data' + (state.pin ? '&pin=' + encodeURIComponent(state.pin) : ''));
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    state.data = j.data; state.unlocked = !!j.unlocked;
    if (state.pin && !j.unlocked) lockPhone();
    LS.set('hl27_cache', j.data);
    state.queue.forEach(q => applyLocal(q.action, q.payload));
    render();
    flush(false);
  } catch (e) {
    if (!state.data) { $('#panel').innerHTML = '<div class="empty">Couldn\'t reach the trip data. Check your signal and refresh.</div>'; }
    else toast('No signal. Showing the last saved copy.');
  }
}
